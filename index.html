<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0c1728">
<title>АвтОграфф · Пульт оператора</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f5eff'/%3E%3Cpath d='M18 40h28M20 40l-2-8 4-7h20l4 7-2 8M22 46v-4M42 46v-4' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25' cy='34' r='2' fill='white'/%3E%3Ccircle cx='39' cy='34' r='2' fill='white'/%3E%3C/svg%3E">
<style>
/* ============ АвтОграфф · Пульт оператора ============ */
:root{
  --bg:#eef2f8;
  --bg-glow:radial-gradient(1100px 520px at 88% -12%,#dfe9ff 0%,transparent 62%),radial-gradient(900px 480px at -8% 108%,#e2f6ec 0%,transparent 58%);
  --surface:#ffffff;
  --surface-2:#f6f8fc;
  --surface-3:#edf1f8;
  --text:#0f1a2b;
  --text-2:#33445c;
  --muted:#65758c;
  --line:#dce4ef;
  --line-2:#e9eef6;
  --brand:#1f5eff;
  --brand-2:#4b86ff;
  --brand-soft:#e9f0ff;
  --navy:#0c1728;
  --navy-2:#132238;
  --say:#fff6d6;
  --say-line:#f0cd55;
  --say-text:#3c2f06;
  --green:#0f8a4b;
  --green-soft:#e5f7ee;
  --amber:#a85a06;
  --amber-soft:#fff3df;
  --red:#c62828;
  --red-soft:#fdecec;
  --violet:#6d28d9;
  --violet-soft:#f2ebff;
  --shadow:0 1px 2px rgba(16,26,43,.05),0 16px 40px -26px rgba(16,26,43,.45);
  --shadow-lg:0 24px 70px -30px rgba(10,20,40,.5);
  --r:16px;
  --r-sm:11px;
  --rail:92px;
  --top:68px;
  --side:376px;
  --ff:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
html[data-theme="dark"]{
  --bg:#080e17;
  --bg-glow:radial-gradient(1100px 520px at 88% -12%,#12213c 0%,transparent 62%),radial-gradient(900px 480px at -8% 108%,#0d231c 0%,transparent 58%);
  --surface:#111a27;
  --surface-2:#16202f;
  --surface-3:#1b2637;
  --text:#e9eef7;
  --text-2:#c3cede;
  --muted:#8b9bb0;
  --line:#253346;
  --line-2:#1d2938;
  --brand:#6b98ff;
  --brand-2:#4b86ff;
  --brand-soft:#16264a;
  --navy:#070d16;
  --navy-2:#0d1726;
  --say:#3a3216;
  --say-line:#7c6722;
  --say-text:#f8ecb8;
  --green:#46d98a;
  --green-soft:#0f2a1d;
  --amber:#f6b93b;
  --amber-soft:#2e2410;
  --red:#ff7272;
  --red-soft:#341717;
  --violet:#b39aff;
  --violet-soft:#241a3a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 44px -28px rgba(0,0,0,.8);
  --shadow-lg:0 30px 80px -30px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--bg);background-image:var(--bg-glow);background-attachment:fixed;
  color:var(--text);font-family:var(--ff);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:var(--brand);text-decoration:none}
h1,h2,h3,h4,p{margin:0}
svg{display:block}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}
.ic.xs{width:15px;height:15px}
.ic.lg{width:26px;height:26px}
.ic.fill{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
::selection{background:var(--brand);color:#fff}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100dvh}
.rail{
  width:var(--rail);flex:none;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
  color:#93a4bd;position:sticky;top:0;height:100dvh;z-index:60;
  display:flex;flex-direction:column;align-items:center;padding:14px 8px 12px;
  border-right:1px solid rgba(255,255,255,.05);
}
.brandmark{
  width:52px;height:52px;border-radius:15px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,#2f6dff,#1237a8);box-shadow:0 10px 24px -10px rgba(47,109,255,.9);
  margin-bottom:20px;flex:none;position:relative;overflow:hidden;
}
.brandmark:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.32),transparent 48%)}
.brandmark .ic{width:28px;height:28px;position:relative;z-index:1}
.railitems{display:flex;flex-direction:column;gap:4px;width:100%}
.railbtn{
  width:100%;min-height:58px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#8fa1ba;font-size:10.5px;font-weight:650;letter-spacing:.01em;padding:7px 2px;transition:.16s;position:relative;
}
.railbtn .ic{width:23px;height:23px;stroke-width:1.7}
.railbtn:hover{background:rgba(255,255,255,.06);color:#dbe6f5}
.railbtn.on{background:rgba(74,131,255,.16);color:#fff}
.railbtn.on:before{content:"";position:absolute;left:-8px;top:15px;bottom:15px;width:3px;border-radius:0 3px 3px 0;background:#5b8dff}
.railbtn .badge{position:absolute;top:5px;right:11px;min-width:16px;height:16px;border-radius:8px;background:#2f6dff;color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.railspacer{flex:1}
.railfoot{display:flex;flex-direction:column;gap:4px;width:100%}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- topbar ---------- */
.topbar{
  height:var(--top);flex:none;display:flex;align-items:center;gap:12px;padding:0 22px;
  background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;
}
.tb-title{display:flex;align-items:center;gap:10px;min-width:0}
.tb-title h1{font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.tb-sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.tb-spacer{flex:1}
.statuspill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;white-space:nowrap;border:1px solid transparent}
.statuspill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
.statuspill.s-progress{background:var(--brand-soft);color:var(--brand);border-color:color-mix(in srgb,var(--brand) 22%,transparent)}
.statuspill.s-akt{background:var(--green-soft);color:var(--green);border-color:color-mix(in srgb,var(--green) 25%,transparent)}
.statuspill.s-callback{background:var(--amber-soft);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 25%,transparent)}
.statuspill.s-refusal{background:var(--red-soft);color:var(--red);border-color:color-mix(in srgb,var(--red) 25%,transparent)}
.iconbtn{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--text-2);
  border:1px solid transparent;transition:.15s;flex:none;position:relative;
}
.iconbtn:hover{background:var(--surface-2);border-color:var(--line);color:var(--text)}
.iconbtn.danger:hover{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 25%,transparent);color:var(--red)}
.iconbtn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.iconbtn.primary:hover{background:color-mix(in srgb,var(--brand) 88%,#000);color:#fff}
.iconbtn[data-tip]:hover:after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);right:0;background:var(--navy);color:#fff;font-size:11.5px;font-weight:600;padding:5px 8px;border-radius:7px;white-space:nowrap;z-index:100;pointer-events:none;box-shadow:0 8px 20px -10px #000}
.iconbtn[data-tip-left]:hover:after{content:attr(data-tip-left);position:absolute;top:calc(100% + 7px);left:0;background:var(--navy);color:#fff;font-size:11.5px;font-weight:600;padding:5px 8px;border-radius:7px;white-space:nowrap;z-index:100;pointer-events:none}

/* ---------- view ---------- */
.view{flex:1;width:100%;max-width:1680px;margin:0 auto;padding:22px 24px 48px}
.view.narrow{max-width:1180px}
.page-head{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:26px;letter-spacing:-.025em;font-weight:850}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:3px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- call layout ---------- */
.call-grid{display:grid;grid-template-columns:minmax(0,1fr) var(--side);gap:22px;align-items:start}
.script-col{min-width:0;display:flex;flex-direction:column;gap:14px}

/* stepper */
.stepper{display:flex;gap:6px;overflow:auto;padding:2px 1px 6px;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.step-pill{
  flex:1 0 auto;min-width:94px;display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:11px;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:11.5px;font-weight:700;
  white-space:nowrap;transition:.15s;position:relative;
}
.step-pill .num{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);font-size:10.5px;font-weight:800;flex:none}
.step-pill.done{color:var(--green);border-color:color-mix(in srgb,var(--green) 22%,var(--line));background:var(--green-soft)}
.step-pill.done .num{background:var(--green);color:#fff}
.step-pill.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 10px 22px -14px rgba(10,20,40,.8)}
html[data-theme="dark"] .step-pill.on{background:var(--brand);border-color:var(--brand)}
.step-pill.on .num{background:rgba(255,255,255,.18);color:#fff}
.step-pill:hover{border-color:var(--brand-2)}

/* main card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.step-card{padding:22px 24px 20px;position:relative;overflow:hidden}
.step-card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--brand),#7c3aed 55%,#06b6d4)}
.step-top{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.backbtn{width:29px;height:29px;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--text-2);flex:none}
.backbtn:hover{color:var(--text);border-color:var(--line)}
.step-eyebrow{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.kicker{font-size:10.5px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.kicker.mut{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:750;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);white-space:nowrap}
.chip .ic{width:13px;height:13px}
.chip.g{background:var(--green-soft);color:var(--green);border-color:color-mix(in srgb,var(--green) 20%,transparent)}
.chip.a{background:var(--amber-soft);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 22%,transparent)}
.chip.r{background:var(--red-soft);color:var(--red);border-color:color-mix(in srgb,var(--red) 20%,transparent)}
.chip.b{background:var(--brand-soft);color:var(--brand);border-color:color-mix(in srgb,var(--brand) 20%,transparent)}
.chip.v{background:var(--violet-soft);color:var(--violet);border-color:color-mix(in srgb,var(--violet) 20%,transparent)}
.step-title{font-size:23px;line-height:1.2;letter-spacing:-.02em;font-weight:850;margin-bottom:5px}
.step-desc{color:var(--muted);font-size:13px;margin-bottom:15px;max-width:78ch}

/* say block */
.sayblock{position:relative;background:var(--say);border:1px solid var(--say-line);border-radius:15px;padding:16px 52px 16px 18px;margin:2px 0 12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.sayblock:before{content:"“";position:absolute;left:9px;top:2px;font-size:34px;line-height:1;font-family:Georgia,serif;color:color-mix(in srgb,var(--say-line) 80%,transparent);opacity:.7}
.sayblock .lab{font-size:9.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--say-text) 62%,transparent);margin-bottom:5px;padding-left:2px}
.sayblock .txt{font-size:19.5px;line-height:1.45;font-weight:650;color:var(--say-text);letter-spacing:-.005em}
.sayblock .txt b,.sayblock .txt strong{background:linear-gradient(transparent 55%,rgba(255,214,64,.85) 55%);padding:0 2px;border-radius:2px;font-weight:850}
.sayblock .copy{position:absolute;right:9px;top:9px;width:33px;height:33px;border-radius:9px;display:grid;place-items:center;color:var(--say-text);background:rgba(255,255,255,.42);border:1px solid rgba(0,0,0,.06)}
.sayblock .copy:hover{background:rgba(255,255,255,.7)}
.sayblock.small .txt{font-size:16.5px}
.sayblock.alt{background:var(--surface-2);border-color:var(--line);box-shadow:none}
.sayblock.alt:before{color:var(--line)}
.sayblock.alt .lab{color:var(--muted)}
.sayblock.alt .txt{color:var(--text-2);font-size:15.5px;font-weight:600}
.variants{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.vtab{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:11.5px;font-weight:750}
.vtab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.vtab:hover{border-color:var(--brand-2)}

/* note */
.note{display:flex;gap:9px;align-items:flex-start;background:var(--surface-2);border:1px dashed var(--line);border-radius:11px;padding:9px 11px;color:var(--muted);font-size:12.5px;line-height:1.45;margin:0 0 12px}
.note .ic{width:16px;height:16px;margin-top:1px;color:var(--brand)}
.note.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 28%,transparent);color:var(--amber)}
.note.warn .ic{color:var(--amber)}
.note.bad{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 25%,transparent);color:var(--red)}
.note.bad .ic{color:var(--red)}
.note.good{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green)}
.note.good .ic{color:var(--green)}
.note b{color:inherit}

/* answer buttons */
.answers-lab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 8px}
.answers-lab .l{font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans{
  display:flex;align-items:center;gap:10px;text-align:left;min-height:54px;padding:10px 12px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:14px;
  transition:.14s;position:relative;
}
.ans .ai{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--text-2);flex:none}
.ans .ai .ic{width:18px;height:18px}
.ans .tx{flex:1;min-width:0;line-height:1.25}
.ans .tx small{display:block;font-weight:550;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
.ans .ar{opacity:.35;flex:none;transition:.14s}
.ans:hover{border-color:var(--brand-2);background:var(--surface);box-shadow:0 8px 20px -16px rgba(16,26,43,.5);transform:translateY(-1px)}
.ans:hover .ar{opacity:.9;transform:translateX(2px)}
.ans.go{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 25%,var(--line))}
.ans.go .ai{background:var(--green);border-color:var(--green);color:#fff}
.ans.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 25%,var(--line))}
.ans.warn .ai{background:var(--amber);border-color:var(--amber);color:#fff}
.ans.stop{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 22%,var(--line))}
.ans.stop .ai{background:var(--red);border-color:var(--red);color:#fff}
.ans.brand{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 25%,var(--line))}
.ans.brand .ai{background:var(--brand);border-color:var(--brand);color:#fff}
.ans.wide{grid-column:1/-1}
.ans:disabled{opacity:.45;transform:none;box-shadow:none}

/* inline form */
.iform{display:flex;gap:8px;align-items:stretch;margin:0 0 10px;flex-wrap:wrap}
.ifield{flex:1;min-width:150px;position:relative}
.ifield .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:17px;height:17px}
.ifield input,.ifield select,.ifield textarea{
  width:100%;min-height:46px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);
  padding:10px 12px 10px 36px;font-size:14.5px;font-weight:600;color:var(--text);outline:none;transition:.15s;
}
.ifield input:focus,.ifield select:focus,.ifield textarea:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 14%,transparent)}
.ifield.noic input,.ifield.noic select,.ifield.noic textarea{padding-left:12px}
.ifield select{appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 20px,calc(100% - 11px) 20px;background-size:5px 5px;background-repeat:no-repeat}
.ifield textarea{min-height:78px;padding-top:11px;resize:vertical;line-height:1.4}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:10px 15px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-weight:750;font-size:13.5px;transition:.14s;white-space:nowrap;
}
.btn .ic{width:17px;height:17px}
.btn:hover{background:var(--surface-3);border-color:var(--line)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 10px 22px -14px rgba(31,94,255,.9)}
.btn.primary:hover{background:color-mix(in srgb,var(--brand) 88%,#000)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.green:hover{background:color-mix(in srgb,var(--green) 88%,#000)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:color-mix(in srgb,var(--red) 88%,#000)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 10px;font-size:12px;border-radius:9px}
.btn.sm .ic{width:14px;height:14px}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* budget chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);font-size:12.5px;font-weight:700;transition:.13s}
.chipbtn:hover{border-color:var(--brand-2);color:var(--text)}
.chipbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* check list in step */
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}
.checkcard{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px}
.checkcard .top{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.checkcard .top .ic{width:16px;height:16px;color:var(--brand)}
.checkcard .top .nm{font-size:11px;font-weight:850;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);flex:1}
.checkcard .seg{display:flex;gap:4px;flex-wrap:wrap}
.segbtn{flex:1;min-width:60px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:11.5px;font-weight:750;transition:.12s;white-space:nowrap}
.segbtn:hover{border-color:var(--brand-2);color:var(--text)}
.segbtn.on{background:var(--text);border-color:var(--text);color:var(--surface)}
.segbtn.on.g{background:var(--green);border-color:var(--green);color:#fff}
.segbtn.on.a{background:var(--amber);border-color:var(--amber);color:#fff}
.segbtn.on.r{background:var(--red);border-color:var(--red);color:#fff}
.checkcard.wide{grid-column:1/-1}

/* verdict box */
.verdict{border-radius:13px;padding:12px 14px;display:flex;gap:11px;align-items:flex-start;margin:10px 0 0;border:1px solid}
.verdict .vi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.verdict .vt{font-weight:850;font-size:14px;margin-bottom:2px}
.verdict .vd{font-size:12.5px;line-height:1.4;opacity:.9}
.verdict.ok{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 25%,transparent);color:var(--green)}
.verdict.ok .vi{background:var(--green)}
.verdict.bad{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 25%,transparent);color:var(--red)}
.verdict.bad .vi{background:var(--red)}
.verdict.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 25%,transparent);color:var(--amber)}
.verdict.warn .vi{background:var(--amber)}
.verdict.info{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 25%,transparent);color:var(--brand)}
.verdict.info .vi{background:var(--brand)}

/* objections quick row */
.objrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.objrow .l{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:2px}
.objchip{padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-size:11.5px;font-weight:700}
.objchip:hover{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}

/* ---------- side panel ---------- */
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(var(--top) + 16px);max-height:calc(100dvh - var(--top) - 32px);overflow:auto;scrollbar-width:thin;padding-bottom:0}
.side::-webkit-scrollbar{width:5px}
.side::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden;flex:0 0 auto}
.side-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line-2);background:linear-gradient(180deg,var(--surface-2),transparent)}
.side-head .ic{width:16px;height:16px;color:var(--brand)}
.side-head .t{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);flex:1}
.side-head .c{font-size:10.5px;font-weight:800;color:var(--muted);background:var(--surface-3);border-radius:6px;padding:2px 6px}
.side-body{padding:12px 14px}
.side-status{display:flex;align-items:center;gap:10px;padding:12px 14px}
.side-status .big{font-size:16px;font-weight:900;letter-spacing:-.01em}
.side-status .sub{font-size:11px;color:var(--muted);margin-top:1px}
.side-status .si{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff}
.side-status.s-progress .si{background:var(--brand)}
.side-status.s-akt .si{background:var(--green)}
.side-status.s-callback .si{background:var(--amber)}
.side-status.s-refusal .si{background:var(--red)}
.side-status.s-akt{background:linear-gradient(180deg,var(--green-soft),transparent)}
.side-status.s-callback{background:linear-gradient(180deg,var(--amber-soft),transparent)}
.side-status.s-refusal{background:linear-gradient(180deg,var(--red-soft),transparent)}
.side-status.s-progress{background:linear-gradient(180deg,var(--brand-soft),transparent)}

.kv{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line-2);font-size:12.5px}
.kv:last-child{border-bottom:0}
.kv .k{width:96px;flex:none;color:var(--muted);font-weight:650;font-size:11.5px;padding-top:1px}
.kv .v{flex:1;font-weight:650;min-width:0;line-height:1.35}
.kv .v.mut{color:var(--muted);font-weight:550}
.kv .v input{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 4px;font-size:12.5px;font-weight:650;color:var(--text);outline:none}
.kv .v input:hover{border-color:var(--line)}
.kv .v input:focus{border-color:var(--brand);background:var(--surface-2)}

.qual{display:flex;flex-direction:column;gap:1px}
.qrow{display:flex;align-items:center;gap:8px;padding:7px 4px;border-radius:8px;font-size:12px;font-weight:650;cursor:pointer}
.qrow:hover{background:var(--surface-2)}
.qrow .qi{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--muted)}
.qrow .qi .ic{width:11px;height:11px;stroke-width:2.6}
.qrow .qn{flex:1;color:var(--text-2)}
.qrow .qv{font-size:10.5px;font-weight:800;color:var(--muted);text-align:right;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow.ok .qi{background:var(--green);color:#fff}
.qrow.ok .qv{color:var(--green)}
.qrow.bad .qi{background:var(--red);color:#fff}
.qrow.bad .qv{color:var(--red)}
.qrow.warn .qi{background:var(--amber);color:#fff}
.qrow.warn .qv{color:var(--amber)}
.qrow.skip .qi{background:var(--surface-3);color:var(--muted)}

.comment{width:100%;min-height:156px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);padding:10px;font-size:11.5px;line-height:1.5;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text-2);resize:vertical}
.comment-actions{display:flex;gap:6px;margin-top:7px}
.side-foot{position:sticky;bottom:0;display:flex;gap:6px;padding:10px 0 4px;background:linear-gradient(180deg,transparent,var(--bg) 34%);z-index:4}
.side-foot .btn{flex:1;min-height:40px;font-size:12px}
.comment-actions .btn{flex:1}

.quickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.quick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 4px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);font-size:10.5px;font-weight:750;text-align:center;transition:.13s;min-height:66px}
.quick .ic{width:19px;height:19px}
.quick:hover{border-color:var(--brand-2);background:var(--surface);color:var(--text);transform:translateY(-1px)}
.quick.red{color:var(--red);background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 18%,transparent)}
.quick.amber{color:var(--amber);background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 20%,transparent)}
.quick.violet{color:var(--violet);background:var(--violet-soft);border-color:color-mix(in srgb,var(--violet) 20%,transparent)}
.quick.green{color:var(--green);background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 20%,transparent)}

/* ---------- objections view ---------- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.searchbox{position:relative;flex:1;min-width:220px;max-width:420px}
.searchbox .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:17px;height:17px}
.searchbox input{width:100%;min-height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:9px 12px 9px 38px;font-size:13.5px;outline:none}
.searchbox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 13%,transparent)}
.filters{display:flex;gap:5px;flex-wrap:wrap}
.fbtn{padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;font-weight:750}
.fbtn:hover{border-color:var(--brand-2);color:var(--text)}
.fbtn.on{background:var(--text);border-color:var(--text);color:var(--surface)}
.fbtn .n{opacity:.55;font-size:10.5px;margin-left:3px}
.objgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.objcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 15px;text-align:left;transition:.14s;display:flex;flex-direction:column;gap:7px;min-height:110px}
.objcard:hover{border-color:var(--brand-2);box-shadow:var(--shadow);transform:translateY(-1px)}
.objcard .oc-top{display:flex;align-items:center;gap:8px}
.objcard .oc-ic{width:32px;height:32px;border-radius:9px;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;flex:none}
.objcard .oc-ic .ic{width:17px;height:17px}
.objcard .oc-cat{font-size:9.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.objcard .oc-t{font-size:14px;font-weight:800;line-height:1.25;color:var(--text)}
.objcard .oc-d{font-size:11.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.objcard .oc-f{margin-top:auto;display:flex;align-items:center;gap:5px;color:var(--brand);font-size:10.5px;font-weight:800}

/* ---------- rules ---------- */
.rules-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.rsum{border-radius:12px;padding:11px 13px;border:1px solid;display:flex;align-items:center;gap:10px}
.rsum .n{font-size:22px;font-weight:900;letter-spacing:-.03em;line-height:1}
.rsum .l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.rsum.stop{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 22%,transparent);color:var(--red)}
.rsum.half{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--amber)}
.rsum.exception{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 22%,transparent);color:var(--brand)}
.rsum.ok{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green)}
.rulegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:9px}
.rulecard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:11px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.rulecard.l-stop{border-left-color:var(--red)}
.rulecard.l-half{border-left-color:var(--amber)}
.rulecard.l-exception{border-left-color:var(--brand)}
.rulecard.l-ok{border-left-color:var(--green)}
.rulecard .rc-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lvl{font-size:9px;font-weight:900;letter-spacing:.06em;padding:2px 6px;border-radius:5px;text-transform:uppercase}
.lvl.stop{background:var(--red-soft);color:var(--red)}
.lvl.half{background:var(--amber-soft);color:var(--amber)}
.lvl.exception{background:var(--brand-soft);color:var(--brand)}
.lvl.ok{background:var(--green-soft);color:var(--green)}
.rulecard .rc-cat{font-size:9.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.rulecard .rc-t{font-size:13.5px;font-weight:800;line-height:1.3}
.rulecard .rc-d{font-size:11.5px;color:var(--muted);line-height:1.45}
.rulecard .rc-f{font-size:11.5px;line-height:1.4;background:var(--surface-2);border-radius:7px;padding:6px 8px;color:var(--text-2)}
.rulecard .rc-f b{color:var(--green);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:1px}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty .ic{width:36px;height:36px;margin:0 auto 10px;opacity:.4}
.empty b{display:block;color:var(--text-2);margin-bottom:3px}

/* ---------- cities ---------- */
.citylayout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.citygroup{margin-bottom:16px}
.citygroup h3{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 7px;display:flex;align-items:center;gap:7px}
.citygroup h3 .ic{width:14px;height:14px}
.citygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:6px}
.citycard{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:650;text-align:left;transition:.12s}
.citycard:hover{border-color:var(--brand-2);background:var(--surface-2)}
.citycard .cc-ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--muted)}
.citycard .cc-ic .ic{width:13px;height:13px}
.citycard.ok .cc-ic{background:var(--green-soft);color:var(--green)}
.citycard.stop .cc-ic{background:var(--red-soft);color:var(--red)}
.citycard.other .cc-ic{background:var(--amber-soft);color:var(--amber)}
.citycard .cc-r{display:block;font-size:9.5px;color:var(--muted);font-weight:600;margin-top:1px}
.citycard .cc-s{margin-left:auto;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.citycard.ok .cc-s{color:var(--green)}.citycard.stop .cc-s{color:var(--red)}.citycard.other .cc-s{color:var(--amber)}
.cityinfo{position:sticky;top:calc(var(--top) + 16px)}
.cityinfo .ci{padding:14px 16px;border-bottom:1px solid var(--line-2)}
.cityinfo .ci:last-child{border-bottom:0}
.cityinfo .ci h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.cityinfo .ci p{font-size:12.5px;color:var(--text-2);line-height:1.5}
.cityinfo .ci .big{font-size:16px;font-weight:850;color:var(--text);margin-bottom:3px}

/* ---------- reference ---------- */
.reflayout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.reftoc{position:sticky;top:calc(var(--top) + 16px);display:flex;flex-direction:column;gap:2px;max-height:calc(100dvh - var(--top) - 32px);overflow:auto}
.reftoc button{text-align:left;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:650;color:var(--muted);border-left:2px solid transparent}
.reftoc button:hover{background:var(--surface);color:var(--text)}
.reftoc button.on{color:var(--brand);background:var(--brand-soft);border-left-color:var(--brand);font-weight:800}
.refsec{background:var(--surface);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden;scroll-margin-top:calc(var(--top) + 16px)}
.refsec>summary{padding:14px 16px;font-size:14.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none}
.refsec>summary::-webkit-details-marker{display:none}
.refsec>summary:after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;transition:.15s}
.refsec[open]>summary:after{transform:rotate(-135deg)}
.refsec>summary .ic{width:17px;height:17px;color:var(--brand)}
.refbody{padding:0 16px 15px;font-size:13px;line-height:1.55;color:var(--text-2)}
.refbody p{margin:0 0 8px}
.refbody ul,.refbody ol{margin:4px 0 9px;padding-left:20px}
.refbody li{margin:3px 0}
.refbody .q{background:var(--say);border:1px solid var(--say-line);border-left:4px solid var(--say-line);border-radius:9px;padding:9px 11px;margin:7px 0;font-size:13px;font-weight:600;color:var(--say-text);line-height:1.5}
.refbody .q b{font-weight:850}
.refbody .nt{font-size:12.5px;color:var(--text-2);background:var(--surface-2);border-left:3px solid var(--line);border-radius:0 7px 7px 0;padding:8px 10px;margin:9px 0}
.refbody .bad{color:var(--red);font-weight:750}
.refbody .good{color:var(--green);font-weight:750}
.refbody table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
.refbody th,.refbody td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.refbody th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2)}
.refbody code{background:var(--surface-3);padding:1px 5px;border-radius:4px;font-size:11.5px}

/* ---------- history ---------- */
.histlist{display:flex;flex-direction:column;gap:8px}
.histcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.histcard .hi-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--muted)}
.histcard .hi-main{flex:1;min-width:0}
.histcard .hi-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px}
.histcard .hi-name{font-size:13.5px;font-weight:800}
.histcard .hi-meta{font-size:11px;color:var(--muted)}
.histcard .hi-txt{font-size:11.5px;color:var(--text-2);background:var(--surface-2);border-radius:7px;padding:7px 9px;margin-top:7px;white-space:pre-wrap;max-height:110px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1.45}
.histcard .hi-act{display:flex;gap:4px;flex:none}

/* ---------- modal ---------- */
.modal-root{position:fixed;inset:0;z-index:200;display:none}
.modal-root.open{display:block}
.modal-back{position:absolute;inset:0;background:rgba(6,12,24,.55);backdrop-filter:blur(3px);animation:fade .18s}
.modal{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100vw - 32px));max-height:calc(100dvh - 48px);
  background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;animation:pop .2s;
}
.modal.wide{width:min(980px,calc(100vw - 32px))}
.modal.slim{width:min(560px,calc(100vw - 32px))}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line-2);flex:none}
.modal-head .mh-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--amber-soft);color:var(--amber)}
.modal-head .mh-ic.b{background:var(--brand-soft);color:var(--brand)}
.modal-head .mh-ic.r{background:var(--red-soft);color:var(--red)}
.modal-head .mh-ic.g{background:var(--green-soft);color:var(--green)}
.modal-head .mh-ic.v{background:var(--violet-soft);color:var(--violet)}
.modal-head .mh-t{font-size:18px;font-weight:850;letter-spacing:-.01em;line-height:1.25}
.modal-head .mh-s{font-size:11.5px;color:var(--muted);margin-top:2px}
.modal-head .iconbtn{margin-left:auto}
.modal-body{padding:16px 20px 20px;overflow:auto;min-height:0}
.modal-foot{padding:12px 20px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface-2);flex:none}
.modal-foot .btn{min-width:110px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* objection modal script */
.om-say{background:var(--say);border:1px solid var(--say-line);border-radius:12px;padding:13px 15px;margin:0 0 9px;position:relative}
.om-say .lab{font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,var(--say-text) 60%,transparent);margin-bottom:4px}
.om-say .txt{font-size:15px;font-weight:650;line-height:1.5;color:var(--say-text)}
.om-say .copy{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.4);color:var(--say-text)}
.om-note{background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 22%,transparent);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--amber);line-height:1.45;margin:9px 0}
.om-note.bad{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 22%,transparent);color:var(--red)}
.om-note.good{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green)}
.om-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:7px;margin-top:12px}
.om-actions .btn{min-height:46px;font-size:12.5px}
.om-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

/* debt checklist */
.debtlist{display:flex;flex-direction:column;gap:6px}
.debtrow{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;transition:.12s}
.debtrow:hover{border-color:var(--brand-2)}

{id:'daleko',cat:'Город',t:'«Далеко / не хочу приезжать»',trig:'Клиент не готов ехать в Москву',ic:'route',
 say:['Да я и не говорю, чтобы вы сейчас приезжали! Подготовим для вас информацию, вы с ней ознакомитесь, и только в том случае, если в нашем автосалоне предложение окажется намного выгоднее, вы готовы будете приехать? Правильно понимаю?','Давайте так: мы вам информацию предоставим, вы сравните со своими вариантами, и если наше предложение по автомобилю будет выгоднее и заманчивее по цене, чем в вашем регионе, то только тогда вы готовы будете к нам приехать, верно?','Мы готовы компенсировать затраты на проезд при покупке автомобиля. В таком случае готовы приехать в Москву?'],
 note:'Не давите на приезд сейчас. Сначала информация и сравнение, приезд — только если выгоднее.',
 actions:[{l:'Готов приехать',a:'goto',v:'car',tone:'go'},{l:'Всё равно нет',a:'refuse',tone:'stop'}]},

{id:'somnevaetsya_visit',cat:'Город',t:'«Сомневаюсь, стоит ли ехать»',trig:'Клиент сомневается в поездке',ic:'help',
 say:['Я уверен(а), мы найдём к вам индивидуальный подход, и лучше, чем у нас, предложения не будет. Если всё-таки наше предложение заинтересовало вас, рассмотрите покупку автомобиля в Москве?'],
 note:'Можно добавить компенсацию проезда, если клиент далеко.',
 actions:[{l:'Рассмотрит',a:'goto',v:'car',tone:'go'},{l:'Отработать «далеко»',a:'open',v:'daleko',tone:'warn'},{l:'Отказ',a:'refuse',tone:'stop'}]},

{id:'komandirovka',cat:'Город',t:'«Я в командировке / в другом городе»',trig:'Клиент физически не в своём регионе',ic:'route',
 say:['Понимаю, спасибо, что сказали. Подскажите, пожалуйста, в каком регионе вы живёте постоянно? Информацию мы подготовим, вы сравните её со своими вариантами, а менеджер позвонит и всё подскажет. Если предложение вас устроит, готовы рассмотреть покупку, правильно понимаю?'],
 note:'Со слов наставника: клиента в командировке по трейд-ину можно отрабатывать, пока он соблюдает условия (регион, гражданство, возраст, КИ).',
 actions:[{l:'Отработал — вернуться',a:'resume',tone:'go'},{l:'Перезвон',a:'callback',tone:'warn'},{l:'Отказ',a:'refuse',tone:'stop'}]},

{id:'drugoi_region',cat:'Город',t:'«Я из другого региона»',trig:'Регион не из списка ЦФО',ic:'map',
 say:['Наш салон в Москве. Подскажите, вы живёте или прописаны в Москве / Московской области? Если да — мы можем подготовить предложение и пригласить вас. Если нет — уточните регион, я подскажу, готовы ли мы компенсировать проезд.'],
 note:'Подходящие регионы — в разделе «Города». Если регион не из списка, уточните готовность приехать.',

{id:'cena_tochno',cat:'Авто',t:'«Назовите точную цену»',trig:'Клиент требует цену или «от скольки»',ic:'wallet',

{id:'ne_opredelilsya',cat:'Авто',t:'«Не определился с маркой и моделью»',trig:'Клиент ещё выбирает',ic:'car',

{id:'premium',cat:'Авто',t:'«Хочу премиум: BMW, Mercedes…»',trig:'Премиум-марка',ic:'star',

{id:'noviy',cat:'Авто',t:'«Хочу только новый»',trig:'У нас проект с БУ',ic:'car',

 note:'Это честное условие, не отработка. Если клиент согласен на залог — продолжаем.',

{id:'obmen',cat:'Авто',t:'«Поменять ключ в ключ»',trig:'Клиент хочет обмен без доплаты',ic:'swap',
 say:['Обмена «ключ в ключ» нет. Есть трейд-ин: оцениваем ваш автомобиль как первоначальный взнос до 70%, остаток можно в кредит.'],
 actions:[{l:'Готов на трейд-ин',a:'open',v:'trade',tone:'go'},{l:'Отказ',a:'refuse',tone:'stop'}]},

{id:'test_drive',cat:'Авто',t:'«Тест-драйв»',trig:'Клиент просит тест-драйв или оператор хочет использовать его в отработке',ic:'alert',

{id:'prinimaete',cat:'Авто',t:'«Вы принимаете машины?»',trig:'Клиент спрашивает про приём автомобилей',ic:'swap',

{id:'garantiya',cat:'Авто',t:'«Гарантия / документы / проверка»',trig:'Клиент спрашивает про гарантию и документы',ic:'doc',

/* ---------- ОПЛАТА ---------- */
{id:'nalichnye',cat:'Оплата',t:'«Только наличные»',trig:'Клиент хочет купить за наличный расчёт',ic:'cash',
 say:['К сожалению, автосалон за наличный расчёт не работает. Готовы рассмотреть частичное кредитование на автомобиль (до 70% первый взнос, от 30% кредит), если условия по кредиту и автомобиль вас заинтересуют?','Своим клиентам предлагаем льготные условия кредитования с пониженной ставкой, и вы могли бы сделать взнос до 70% и на остаток оформить кредит. Готовы рассмотреть условия частичного кредитования?','Я понимаю, что удобнее приехать, сразу заплатить и забыть, но большинство автоцентров не работают за полный наличный расчёт, и наш тоже. Но могу предложить частичное кредитование: до 70% наличными, а маленький остаток в кредит. За вами закрепится скидка до 30%, есть досрочное погашение. Готовы рассмотреть, если предложение вас полностью устроит?'],
 note:'Наличного расчёта нет. ЧК: до 70% наличными, от 30% в кредит. Если клиент только за наличные и ЧК не рассматривает — завершаем.',
 actions:[{l:'Согласился на ЧК',a:'goto',v:'kyc',tone:'go'},{l:'Только наличные — отказ',a:'refuse',tone:'stop'}]},

{id:'chk',cat:'Оплата',t:'«Что такое ЧК?»',trig:'Клиент не понимает частичное кредитование',ic:'percent',
 say:['Частичное кредитование: вы вносите до 70% наличными, от 30% оформляется в кредит. За вами сохраняется скидка до 30% на автомобиль, есть возможность досрочного погашения. Ставки и сроки расскажет менеджер.'],
 actions:[{l:'Понял — вернуться',a:'resume',tone:'go'}]},

{id:'rassrochka',cat:'Оплата',t:'«Есть рассрочка?»',trig:'Клиент просит рассрочку',ic:'calendar',

{id:'lizing',cat:'Оплата',t:'«Работаете с лизингом?»',trig:'Клиент спрашивает про лизинг',ic:'building',

/* ---------- утилиты ---------- */
function $(s,r=document){return r.querySelector(s)}
function $$(s,r=document){return Array.from(r.querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function ic(n,cls=''){return '<svg class="ic '+cls+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}
function pad(n){return ('0'+n).slice(-2)}
function fmt(sec){sec=Math.max(0,Math.floor(sec||0));return Math.floor(sec/60)+':'+pad(sec%60)}
function fmtDate(d){d=new Date(d);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()}
function fmtDateTime(d){d=new Date(d);return fmtDate(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function fmtTime(d){d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes())}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function isoDate(d){d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function termDate(){return addDays(new Date(),30)}
function workDeadline(n=3){
  let d=new Date();let c=0;
  while(true){
    const w=d.getDay();
    if(w!==0&&w!==6){c++;if(c===n)return new Date(d)}
    d=addDays(d,1);
  }
}
function elapsed(){
  if(!S.startedAt)return 0;
  const end=S.completedAt||Date.now();
  return Math.max(0,Math.round((end-S.startedAt)/1000));
}
function plural(n,a,b,c){const x=Math.abs(n)%100,y=x%10;if(x>10&&x<20)return c;if(y>1&&y<5)return b;if(y===1)return a;return c}
function hl(s){return s.replace(/(ГОТОВЫ|В ТЕЧЕНИЕ 30 ДНЕЙ|НЕ ИСКЛЮЧАЕТЕ)/g,'<b>$1</b>')}
function sayText(s){
  return String(s).replace(/\[Имя\]/g,OP||'[Имя]').replace(/\{date\}/g,fmtDate(termDate()));
}
function toast(msg,err){
  const t=$('#toast'),x=$('#toastText');
  if(!t)return;
  x.textContent=msg;
  t.classList.toggle('err',!!err);
  t.querySelector('use').setAttribute('href',err?'#i-alert':'#i-check');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}


/* ---------- каталог автомобилей из Google Sheets ---------- */
function csvRows(text){
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch==='"'&&quoted&&next==='"'){cell+='"';i++;continue}
    if(ch==='"'){quoted=!quoted;continue}
    if(ch===','&&!quoted){row.push(cell);cell='';continue}
    if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';continue}
    cell+=ch;
  }
  if(cell||row.length){row.push(cell);if(row.some(x=>x.trim()))rows.push(row)}
  return rows;
}
function fleetPickName(row){
  const vals=row.map(x=>String(x||'').trim()).filter(Boolean);
  const skip=/^(допускаемые( авто)?|не допускаемые( авто)?|только б\/у|только новые|новые и б\/у|авто|автомобили)$/i;
  const candidates=vals.filter(x=>!skip.test(x)&&!/^[A-ZА-ЯЁ]$/i.test(x));
  return candidates.sort((a,b)=>b.length-a.length)[0]||'';
}
function fleetSheetJsonp(sh){
  return new Promise((resolve,reject)=>{
    const cb='agFleetCb_'+sh.gid+'_'+Date.now()+'_'+Math.floor(Math.random()*10000),script=document.createElement('script');
    let done=false;
    const finish=(fn,val)=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(e){window[cb]=undefined}script.remove();fn(val)};
    const timer=setTimeout(()=>finish(reject,new Error('timeout')),15000);
    window[cb]=data=>finish(resolve,{sh,data});
    script.onerror=()=>finish(reject,new Error('network'));
    script.src=FLEET_JSONP+cb+'&gid='+sh.gid+'&t='+Date.now();
    document.head.appendChild(script);
  });
}
function fleetRowsFromData(data){
  const rows=data&&data.table&&data.table.rows||[];
  return rows.map(r=>(r.c||[]).map(c=>c&&c.v!=null?String(c.v):''));
}
async function loadFleet(){
  if(FLEET.loading)return;
  FLEET.loading=true;FLEET.error='';FLEET.loadedSheets=[];
  try{
    const results=await Promise.all(FLEET_SHEETS.map(async sh=>{
      try{
        const out=await fleetSheetJsonp(sh);
        return {sh,rows:fleetRowsFromData(out.data),ok:true};
      }catch(e){
        /* fallback for normal http hosting */
        try{const r=await fetch(FLEET_BASE+sh.gid+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return {sh,rows:csvRows(await r.text()),ok:true};}
        catch(x){return {sh,ok:false,error:String(x)}}
      }
    }));
    const all=[],failed=[];
    results.forEach(({sh,rows,ok})=>{
      if(!ok){failed.push(sh.label);return}
      FLEET.loadedSheets.push(sh.gid);
      rows.forEach(row=>{const name=fleetPickName(row);if(name)all.push({name,status:sh.status,cat:sh.cat,label:sh.label})});
    });
    const fresh=all;
    if(fresh.length){FLEET.items=fresh;FLEET.loaded=true;FLEET.updatedAt=Date.now();}
    if(failed.length)FLEET.error='Не обновились листы: '+failed.join(', ')+'. Остальные данные доступны.';
    else FLEET.error='';
    try{localStorage.setItem('ag3_fleet_cache',JSON.stringify(FLEET))}catch(e){}
  }catch(e){
    FLEET.error='Не удалось обновить каталог по ссылке. Проверьте интернет и нажмите «Обновить» ещё раз.';
    try{const c=JSON.parse(localStorage.getItem('ag3_fleet_cache')||'null');if(c&&c.items){FLEET=c;FLEET.error='Показан последний сохранённый каталог; обновление по ссылке временно недоступно.'}}catch(x){}
  }finally{FLEET.loading=false;render()}
}
function fleetFiltered(){
  const q=fleetSearch.toLowerCase().replace(/ё/g,'е').trim();
  return FLEET.items.filter(x=>(fleetCat==='all'||x.cat===fleetCat)&&(!q||x.name.toLowerCase().replace(/ё/g,'е').includes(q)));
}

/* ---------- storage ---------- */
function save(){
  try{localStorage.setItem(LS_STATE,JSON.stringify({...S,ts:Date.now()}))}catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem(LS_STATE);
    if(!raw)return false;
    const st=JSON.parse(raw);
    if(!st||!st.ts||Date.now()-st.ts>12*3600*1000)return false;
    if(!st.step||!ORDER.includes(st.step))return false;
    if(st.step==='greet'&&!st.startedAt)return false;
    S=Object.assign(newState(),st);
    return true;
  }catch(e){return false}
}
function loadCalls(){
  try{CALLS=JSON.parse(localStorage.getItem(LS_CALLS)||'[]').filter(c=>c&&c.ts>Date.now()-24*3600*1000)}catch(e){CALLS=[]}
}
function storeCalls(){try{localStorage.setItem(LS_CALLS,JSON.stringify(CALLS.slice(0,60)))}catch(e){}}
function saveCall(partial){
  const out=partial?'progress':outcome();
  if(S.savedId){
    const c=CALLS.find(x=>x.id===S.savedId);
    if(c){c.name=S.name;c.phone=S.phone;c.city=S.city;c.outcome=out;c.dur=elapsed();c.comment=buildComment();c.callback=S.callback}
    storeCalls();return;
  }
  const c={id:Date.now(),ts:Date.now(),name:S.name,phone:S.phone,city:S.city,outcome:out,dur:elapsed(),comment:buildComment(),callback:S.callback,partial:!!partial};
  CALLS.unshift(c);S.savedId=c.id;storeCalls();
}

/* ---------- тема ---------- */
function applyTheme(){
  let t=null;
  try{t=localStorage.getItem(LS_THEME)}catch(e){}
  if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',cur);
  try{localStorage.setItem(LS_THEME,cur)}catch(e){}
  render();
}

/* ---------- квалификация ---------- */
function hasThird(){return !!(S.third&&S.third.who&&S.third.citizenship==='yes'&&S.third.propiskaStatus==='ok'&&S.third.age==='yes'&&S.third.ki==='clean')}
function carStop(){return S.carFlags.some(id=>{const f=CAR_FLAGS.find(x=>x.id===id);return f&&f.lvl==='stop'})&&!S.carOverride}
function qual(){
  const missing=[],fails=[],warn=[];
  if(!S.name)warn.push({k:'Имя клиента',step:'name'});
  if(!S.city)missing.push({k:'Город',step:'region'});
  else if(S.cityStatus==='stop')fails.push({k:'Стоп-регион',step:'region'});
  else if(S.cityStatus==='other'&&!S.regionException)fails.push({k:'Регион не подтверждён',step:'region'});
  if(!S.visit)missing.push({k:'Готовность приехать',step:'region'});
  if(!S.carBrand&&!S.carModel&&!S.budget)missing.push({k:'Авто или бюджет',step:'car'});
  if(carStop())fails.push({k:'Авто не подходит',step:'car'});
  if(!S.pay)missing.push({k:'Способ оплаты',step:'pay'});
  if(S.pay==='cash')fails.push({k:'Только наличные',step:'pay'});
  if(!S.citizenship)missing.push({k:'Гражданство',step:'kyc'});
  if(!S.propiska)missing.push({k:'Прописка',step:'kyc'});
  if(!S.age)missing.push({k:'Возраст',step:'kyc'});
  if(!S.ki)missing.push({k:'КИ',step:'kyc'});
  const kycFail=(S.citizenship==='no')||(S.propiskaStatus==='stop')||(S.age==='no')||(S.ki==='bad');
  if(kycFail){
    if(hasThird())warn.push({k:'Оформление на третье лицо',step:'kyc'});
    else fails.push({k:'Не проходит по кредиту — нужно третье лицо',step:'kyc'});
  }
  if(!S.term)missing.push({k:'Срок покупки',step:'term'});
  else if(S.term==='no')fails.push({k:'Не готов в 30 дней',step:'term'});
  else if(S.term==='conditional'&&S.mode==='strict')warn.push({k:'Условный срок — нужен чёткий ответ',step:'term'});
  else if(S.term!=='yes')warn.push({k:'Срок принят условно: '+(S.termWindow||'нужно условие'),step:'term'});
  if(!S.manager)missing.push({k:'Согласие на звонок',step:'manager'});
  else if(S.manager==='no')fails.push({k:'Не готов принять звонок',step:'manager'});
  const ok=!missing.length&&!fails.length;
  return {ok,missing,fails,warn};
}
function outcome(){
  if(S.refusal)return 'refusal';
  if(S.callback)return 'callback';
  const q=qual();
  const termOk=S.term==='yes'||(S.mode==='practice'&&S.term==='conditional');
  if(q.ok&&termOk&&S.manager==='yes')return 'akt';
  return 'progress';
}
function outcomeInfo(){
  const o=outcome();
  if(o==='akt')return {k:'akt',label:'АКТ',title:'Заявка готова',sub:'Передать менеджеру · В РАБОТЕ',ic:'check',step:''};
  if(o==='callback')return {k:'callback',label:'ПЕРЕЗВОН',title:'Перезвон',sub:S.callback?fmtDate(S.callback.date)+' '+S.callback.time:'',ic:'calendar',step:''};
  if(o==='refusal')return {k:'refusal',label:'НЕ АКТ',title:'Отказ',sub:S.refusal?S.refusal.reason:'Лид не передаём',ic:'ban',step:''};
  const n=S.step==='result'?8:(STEPS.find(x=>x.id===S.step)||{}).n||0;
  return {k:'progress',label:'В РАБОТЕ',title:'Идёт звонок',sub:'Шаг '+n+' из 8',ic:'phone',step:S.step};
}
function carText(){
  if(S.catalogCar&&S.catalogCar.name)return S.catalogCar.name;
  const a=[S.carBrand,S.carModel,S.carYear].filter(Boolean).join(' ');
  return a||'';
}
function budgetLabel(v){
  return {'lt500':'до 500 тыс','500-1000':'500 тыс – 1 млн','1000-3000':'1–3 млн','3000-5000':'3–5 млн','gt5':'выше 5 млн','unknown':'не определился'}[v]||v;
}
function payLabel(v){
  return {credit:'кредит',chk:'частичное кредитование (ЧК)',conditional:'кредит / ЧК — если предложение выгодное',cash:'только наличные',unknown:'не определился'}[v]||v;
}

/* ---------- комментарий ---------- */
function buildComment(){
  const L=[];
  L.push('АЦ АвтОграфф · '+fmtDateTime(new Date()));
  L.push('Клиент: '+(S.name||'—')+(S.phone?' · '+S.phone:''));

  if(S.term)L.push('Срок покупки: '+(S.term==='yes'?'готов в течение 30 дней, до '+fmtDate(termDate()):S.term==='no'?'не готов':S.termWindow||'требует уточнения'));

/* ---------- навигация ---------- */
function go(step){
  if(!ORDER.includes(step))return;
  if(!S.startedAt&&step!=='greet')S.startedAt=Date.now();
  S.step=step;
  save();render();
}
function back(){
  const i=ORDER.indexOf(S.step);
  if(i>0)go(ORDER[i-1]);
}
function nav(v){
  VIEW=v;
  try{history.replaceState(null,'','#'+v)}catch(e){}
  side(false);
  render();
  $('#view')&&$('#view').focus({preventScroll:true});
}
function side(open){
  const el=$('#side'),b=$('#sideback');
  if(!el)return;
  const sheet=window.innerWidth<=1080;
  if(!sheet){
    el.classList.remove('open');
    if(b)b.classList.remove('open');
    if(open)el.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  el.classList.toggle('open',!!open);
  if(b)b.classList.toggle('open',!!open);
}

/* ================= ПРИЛОЖЕНИЕ 2: экран звонка ================= */
function viewCall(){
  return '<div class="call-grid guided"><div class="script-col">'+stepper()+stepCard()+'</div>'+sidePanel()+'</div>'+commentPanel();
}
function stepDone(id){
  if(id==='greet')return !!S.startedAt;
  if(id==='name')return !!S.name;
  if(id==='region')return !!S.city&&!!S.visit;
  if(id==='car')return !!(S.carBrand||S.carModel||S.budget);
  if(id==='pay')return !!S.pay;
  if(id==='kyc')return !!(S.citizenship&&S.propiska&&S.age&&S.ki);
  if(id==='term')return !!S.term;
  if(id==='manager')return !!S.manager;
  return false;
}
function stepper(){
  const hidden=['greet','manager','result'];
  if(hidden.includes(S.step))return '';
  const list=STEPS.filter(s=>!hidden.includes(s.id)),idx=Math.max(0,list.findIndex(s=>s.id===S.step)),cur=list[idx]||list[0];
  const done=list.filter(s=>stepDone(s.id)).length, pct=Math.round((Math.min(idx,list.length-1)/(list.length-1))*100);
  return '<div class="guided-progress"><div class="gp-top"><span>Шаг '+(idx+1)+' из '+list.length+'</span><b>'+esc(cur.t)+'</b><span class="gp-done">'+done+' выполнено</span></div><div class="gp-bar"><i style="width:'+pct+'%"></i></div></div>';
}
function ansBtn(label,icn,tone,act,sub,key){
  return '<button class="ans '+tone+'" '+(key?'data-key="'+key+'"':'')+' onclick="'+act+'">'+
    '<span class="ai">'+ic(icn)+'</span><span class="tx">'+label+(sub?'<small>'+sub+'</small>':'')+'</span>'+ic('chev-r','sm ar')+'</button>';
}
function sayBlock(text,label,cls){
  const spoken=sayText(text),isQuestion=/\?\s*$/.test(spoken.trim())||/\?/.test(spoken);
  const hint=isQuestion?'ВОПРОС · в конце голос вверх ↗':'УТВЕРЖДЕНИЕ · спокойно и уверенно ↘';
  return '<div class="sayblock '+(cls||'')+' '+(isQuestion?'question':'statement')+'">'+
    '<button class="copy" type="button" onclick="A.copySay(this)" title="Скопировать">'+ic('copy','sm')+'</button>'+
    '<div class="lab">'+(label||'Вы говорите')+'</div><div class="say-hint">'+hint+'</div><div class="txt">'+hl(esc(spoken))+'</div></div>';
}
function noteBox(text,kind,icon){
  return '<div class="note '+(kind||'')+'">'+ic(icon||'info')+'<div>'+text+'</div></div>';
}
function objChip(id,label){
  const o=OBJECTIONS.find(x=>x.id===id);
  return '<button class="objchip" onclick="A.obj(\''+id+'\')">'+esc(label||(o?o.t:id))+'</button>';

function stepHead(k,t,desc){
  const back=(S.step!=='greet'&&S.step!=='result')?'<button class="iconbtn backbtn" onclick="A.back()" title="Назад">'+ic('back')+'</button>':'';
  const guide={greet:'Выберите приветствие, скажите его и дождитесь ответа клиента.',name:'Спросите имя. Если клиент не назвал — не настаивайте и переходите дальше.',region:'Уточните город или регион и затем спросите, готов ли клиент приехать.',car:'Спросите марку и модель. Если клиент не определился — уточните бюджет.',pay:'Уточните способ оплаты. Если клиент сомневается, предложите вариант при выгодных условиях.',kyc:'Нажмите вопросы по очереди. Для каждого вопроса откроется отдельное окно.',term:'Уточните готовность купить в течение 30 дней или при выгодном предложении.',manager:'Спросите согласие на звонок менеджера от 1 до 2 минут.',result:'Проверьте результат и передайте менеджеру готовый комментарий.'};
  return '<div class="step-top">'+back+'<div class="step-eyebrow"><span class="kicker">'+k+'</span></div></div><h2 class="step-title">'+t+'</h2><p class="step-desc">'+(desc||'')+'</p><div class="operator-guide">'+ic('arrow')+'<span><b>Что делать сейчас:</b> '+guide[S.step]+'</span></div>';
}
function stepCard(){
  if(S.step==='greet')return greetCard();
  if(S.step==='name')return nameCard();

function seg(field,val,label,tone){
  const on=S[field]===val;

function kycVerdict(){
  const miss=[];
  if(!S.citizenship)miss.push('гражданство');
  if(!S.propiska)miss.push('прописку');
  if(!S.age)miss.push('возраст');
  if(!S.ki)miss.push('кредитную историю');
  if(miss.length)return {k:'warn',t:'Заполните: '+miss.join(', '),d:'Это обязательные вопросы скрипта.'};
  const bad=[];
  if(S.citizenship==='no')bad.push('нет гражданства РФ');
  if(S.propiskaStatus==='stop')bad.push('стоп-регион прописки');
  if(S.age==='no')bad.push('возраст вне 21–70');
  if(S.ki==='bad')bad.push('проблемы с КИ');
  if(!bad.length)return {k:'ok',t:'Клиент проходит',d:'Гражданство, прописка, возраст и КИ в порядке. Дальше — срок покупки.'};
  if(hasThird())return {k:'ok',t:'Оформление на третье лицо',d:'Основной клиент не проходит ('+bad.join(', ')+'), но третье лицо подходит.'};
  return {k:'bad',t:'Нужно третье лицо',d:'Причина: '+bad.join(', ')+'. Предложите оформление на родственника или знакомого.'};
}

/* ---------- ПРАВИЛА ---------- */
function ruleFiltered(){
  const q=ruleSearch.toLowerCase().replace(/ё/g,'е').trim();
  return RULES.filter(r=>{
    if(ruleLvl!=='all'&&r.lvl!==ruleLvl)return false;
    if(ruleCat!=='Все'&&r.cat!==ruleCat)return false;
    if(!q)return true;
    return (r.t+' '+r.d+' '+r.f+' '+r.cat).toLowerCase().replace(/ё/g,'е').includes(q);
  });
}
function ruleCards(){
  const list=ruleFiltered();

function viewRef(){
  let h='<div class="page-head"><div><h2>Методичка</h2><p>Скрипт, условия, критерии трейд-ина, фразы и запреты. Всё в одном месте.</p></div><div class="page-actions"><button class="btn" onclick="A.help()">'+ic('help')+' Помощь</button></div></div>';
  h+='<div class="reflayout"><nav class="reftoc">';
  REF.forEach(r=>{h+='<button class="'+(REF_OPEN===r.id?'on':'')+'" onclick="A.ref(\''+r.id+'\')">'+esc(r.t)+'</button>'});
  h+='</nav><div>';
  REF.forEach(r=>{
    h+='<details class="refsec" id="ref-'+r.id+'" '+(REF_OPEN===r.id?'open':'')+'><summary>'+ic(r.ic)+esc(r.t)+'</summary><div class="refbody">'+r.html+'</div></details>';
  });
  h+='</div></div>';return h;
}

/* ---------- ИСТОРИЯ ---------- */
function histOutcome(c){
  if(c.outcome==='akt')return '<span class="chip g">АКТ</span>';
  if(c.outcome==='callback')return '<span class="chip a">Перезвон</span>';
  if(c.outcome==='refusal')return '<span class="chip r">Не акт</span>';
  return '<span class="chip">Не завершён</span>';
}
function viewHistory(){
  let h='<div class="page-head"><div><h2>История</h2><p>Хранится только в этом браузере.</p></div><div class="page-actions"><button class="btn" onclick="A.clearHist()">'+ic('trash')+' Очистить</button></div></div>';
  if(!CALLS.length){return h+'<div class="empty">'+ic('history')+'<b>Пока пусто</b>Завершённые звонки появятся здесь. Комментарий можно будет скопировать позже.</div>'}
  h+='<div class="histlist">';
  CALLS.slice().sort((a,b)=>b.ts-a.ts).forEach(c=>{
    h+='<div class="histcard"><div class="hi-ic">'+ic(c.outcome==='akt'?'check':c.outcome==='callback'?'calendar':c.outcome==='refusal'?'ban':'phone')+'</div><div class="hi-main"><div class="hi-top"><span class="hi-name">'+esc(c.name||'Без имени')+'</span>'+histOutcome(c)+'<span class="hi-meta">'+fmtDateTime(c.ts)+' · '+fmt(c.dur||0)+'</span></div><div class="hi-meta">'+esc(c.city||'город не указан')+(c.phone?' · '+esc(c.phone):'')+'</div><details style="margin-top:6px"><summary class="hi-meta" style="cursor:pointer">Комментарий</summary><div class="hi-txt">'+esc(c.comment||'')+'</div></details></div><div class="hi-act"><button class="iconbtn" onclick="A.copyHist('+c.id+')" title="Копировать">'+ic('copy')+'</button><button class="iconbtn danger" onclick="A.delHist('+c.id+')" title="Удалить">'+ic('trash')+'</button></div></div>';
  });
  h+='</div>';return h;
}

/* ---------- МОДАЛЬНЫЕ ОКНА ---------- */
function modalHead(icon,title,sub,tone){
  return '<div class="modal-head"><div class="mh-ic '+(tone||'')+'">'+ic(icon)+'</div><div><div class="mh-t">'+title+'</div><div class="mh-s">'+sub+'</div></div><button class="iconbtn" onclick="A.close()" title="Закрыть">'+ic('close')+'</button></div>';
}
function openModal(html,cls){
  const r=$('#modalRoot');
  r.style.display='block';
  r.innerHTML='<div class="modal-back" onclick="A.close()"></div>'+html;
  r.classList.add('open');
  document.body.classList.add('modal-open');
  document.documentElement.classList.add('modal-open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  const r=$('#modalRoot');
  r.classList.remove('open');
  r.style.display='none';
  r.innerHTML='';
  document.body.classList.remove('modal-open');
  document.documentElement.classList.remove('modal-open');
  document.body.style.overflow='';
  document.body.style.filter='';
  document.documentElement.style.filter='';
  if(HOLD_T){clearInterval(HOLD_T);HOLD_T=null;HOLD_RUN=false}
}

/* возражение */
function retainModal(o){
  const idx=Math.min(2,RETAIN_PROGRESS[o.id]||0), labels=['Способ 1 из 3','Способ 2 из 3','Способ 3 из 3'];
  let h='<div class="modal wide retain-modal">'+modalHead(o.ic,'<h2 class="retain-title">ТРИ ВАРИАНТА ОТРАБОТКИ</h2>',esc(o.t)+' · '+labels[idx]+' · сначала удерживаем, потом отказ','');
  h+='<div class="modal-body"><div class="retain-progress"><span class="on">1</span><i></i><span class="'+(idx>=1?'on':'')+'">2</span><i></i><span class="'+(idx>=2?'on':'')+'">3</span></div>';
  h+=noteBox('Не отказываем сразу. Дайте клиенту три последовательных варианта и после каждого дождитесь ответа.','warn','info');
  h+=sayBlock(o.say[idx],'Скажите сейчас');
  h+='<div class="om-actions"><button class="btn green" onclick="A.objAction(\'nalichnye\',0)">'+ic('check')+' Согласился на частичное кредитование</button>';
  if(idx<2)h+='<button class="btn" onclick="A.retainNext(\'nalichnye\')">'+ic('arrow')+' Не согласился — следующий способ</button>';
  else h+='<button class="btn red" onclick="A.doRefuse(\'Только наличные — 3 способа не сработали\')">'+ic('ban')+' Не согласился — отказ</button>';
  h+='</div></div></div>';openModal(h);
}
function objModal(id){
  const o=OBJECTIONS.find(x=>x.id===id);
  if(!o)return;
  if(o.id==='nalichnye'){retainModal(o);return}
  let h='<div class="modal wide">'+modalHead(o.ic,esc(o.t),esc(o.cat)+' · '+esc(o.trig),'');
  h+='<div class="modal-body">';
  o.say.forEach((s,i)=>{h+=sayBlock(s,o.say.length>1?'Вариант '+(i+1):'Скажите',i===0?'':'alt small')});
  if(o.note)h+='<div class="om-note '+(o.note.indexOf('не акт')>=0||o.note.indexOf('Не передаём')>=0||o.note.indexOf('отказ')>=0?'bad':'')+'">'+ic('info')+' '+esc(o.note)+'</div>';
  h+='<div class="om-actions">';
  o.actions.forEach((a,i)=>{
    const label=a.l.replace(/\{date\}/g,fmtDate(termDate()));
    const tone=a.tone||'';
    h+='<button class="btn '+(tone==='go'?'green':tone==='stop'?'red':'')+'" onclick="A.objAction(\''+o.id+'\','+i+')">'+esc(label)+'</button>';
  });
  h+='</div></div></div>';
  openModal(h);
}

/* город */
function cityListHtml(q){
  const qq=(q||'').toLowerCase().replace(/ё/g,'е').trim();
  const f=x=>!qq||(x.c+' '+x.r+' '+(x.note||'')).toLowerCase().replace(/ё/g,'е').includes(qq);
  const groups=[['ok','Подходят',CITY_OK.filter(f)],['other','Другие регионы — уточнить',CITY_OTHER.filter(f)],['stop','Стоп-регионы для прописки',CITY_STOP.filter(f)]];
  let h='';
  groups.forEach(g=>{
    if(!g[2].length)return;
    h+='<div class="citygroup"><h3>'+ic(g[0]==='ok'?'check':g[0]==='stop'?'ban':'alert')+' '+g[1]+'</h3>';
    g[2].forEach(x=>{
      const st=g[0];
      const label=st==='ok'?'подходит':st==='stop'?'стоп':'уточнить';
      h+='<button class="cityrow '+st+'" onclick="A.cityPick(\''+esc(x.c).replace(/'/g,"\'")+'\',\''+st+'\')"><span class="cr-ic">'+ic(st==='stop'?'ban':st==='ok'?'check':'map')+'</span><span class="cr-t">'+esc(x.c)+'<small>'+esc(x.r)+(x.note?' · '+esc(x.note):'')+'</small></span><span class="cr-s">'+label+'</span></button>';
    });
    h+='</div>';
  });
  return h||'<div class="empty">'+ic('search')+'<b>Не найдено</b>Попробуйте иначе.</div>';
}

/* третье лицо */
function thirdStatusHtml(){
  const d=THIRD_DRAFT||{};
  const miss=[];
  if(!d.who)miss.push('кто это');
  if(!d.citizenship)miss.push('гражданство');
  if(!d.propiska)miss.push('прописка');
  if(!d.age)miss.push('возраст');
  if(!d.ki)miss.push('КИ');
  if(miss.length)return '<div class="verdict info" style="margin:0"><div class="vi">'+ic('info')+'</div><div><div class="vt">Заполните: '+miss.join(', ')+'</div><div class="vd">Без этих данных лид не актуален.</div></div></div>';
  const bad=[];
  if(d.citizenship!=='yes')bad.push('нет гражданства РФ');
  if(d.propiskaStatus==='stop')bad.push('стоп-регион прописки');
  if(d.age!=='yes')bad.push('возраст вне 21–70');
  if(d.ki!=='clean')bad.push('проблемы с КИ');
  if(bad.length)return '<div class="verdict bad" style="margin:0"><div class="vi">'+ic('ban')+'</div><div><div class="vt">Третье лицо не подходит</div><div class="vd">'+bad.join(', ')+'. Нужен другой человек.</div></div></div>';
  return '<div class="verdict ok" style="margin:0"><div class="vi">'+ic('check')+'</div><div><div class="vt">Третье лицо подходит</div><div class="vd">Гражданство РФ, прописка, возраст 21–70 и КИ в порядке.</div></div></div>';
}

  thirdSet(k,v,el){
    if(!THIRD_DRAFT)THIRD_DRAFT={};
    THIRD_DRAFT[k]=v;
    if(k==='propiska'){const c=CITIES.find(x=>x.c===v);THIRD_DRAFT.propiskaStatus=c?(c.status==='stop'?'stop':'ok'):''}
    if(el&&el.parentElement){$$('.segbtn',el.parentElement).forEach(b=>b.classList.remove('on','g','r'));el.classList.add('on');el.classList.add(v==='yes'||v==='clean'?'g':'r')}
    const st=$('#thirdStatus');if(st)st.innerHTML=thirdStatusHtml();
  },
  thirdNext(){const d=THIRD_DRAFT||{};if(THIRD_STEP===0&&!d.who){toast('Сначала укажите, кто будет третьим лицом',true);return}if(THIRD_STEP===2&&!d.propiska){toast('Выберите регион прописки',true);return}THIRD_STEP=Math.min(5,THIRD_STEP+1);thirdModal()},
  thirdBack(){THIRD_STEP=Math.max(0,THIRD_STEP-1);thirdModal()},
  thirdAnswer(k,v){if(!THIRD_DRAFT)THIRD_DRAFT={};THIRD_DRAFT[k]=v;THIRD_STEP=Math.min(5,THIRD_STEP+1);thirdModal()},
  thirdSave(){
    const d=THIRD_DRAFT||{};
    if(!d.who||!d.citizenship||!d.propiska||!d.age||!d.ki){toast('Заполните все поля третьего лица',true);return}
    S.third={...d};save();closeModal();render();toast(hasThird()?'Третье лицо подходит':'Третье лицо не подходит — проверьте данные',!hasThird());
  },

  tradeModal(){if(!S.tradeFlags)S.tradeFlags=[];tradeModal()},
  toggleTrade(id,el){
    if(!S.tradeFlags)S.tradeFlags=[];
    const i=S.tradeFlags.indexOf(id);
    if(i>=0)S.tradeFlags.splice(i,1);else S.tradeFlags.push(id);
    if(el){const t=TRADE_CHECKS.find(x=>x.id===id);el.classList.toggle('on',S.tradeFlags.includes(id));el.classList.toggle('good',!!t&&t.type==='ok')}
    const v=$('#tradeVerdict');if(v)v.innerHTML=tradeVerdictHtml();save();
  },
  clearTrade(){S.tradeFlags=[];save();tradeModal()},
  applyTrade(){save();closeModal();render();toast('Трейд-ин отмечен')},

  carModal(){carModal()},
  toggleCar(id,el){
    const i=S.carFlags.indexOf(id);
    if(i>=0)S.carFlags.splice(i,1);else S.carFlags.push(id);
    if(el){const f=CAR_FLAGS.find(x=>x.id===id);el.classList.toggle('on',S.carFlags.includes(id));el.classList.toggle('good',!!f&&f.lvl==='ok')}
    const v=$('#carVerdict');if(v)v.innerHTML=carVerdictHtml();
    if(!el){S.carOverride=false;render()}
    save();
  },
  clearCarFlags(){S.carFlags=[];S.carOverride=false;save();closeModal();render()},
  overrideCar(){S.carOverride=true;save();render()},
  applyCar(){closeModal();render();toast('Стоп-лист применён')},

  hospitalModal(){hospitalModal()},
  hospitalQuick(n){
    if(!n){const d=$('#hospDate');if(d)d.value='';A.hospitalCalc();return}
    const d=$('#hospDate');if(d)d.value=isoDate(addDays(new Date(),n));A.hospitalCalc();
  },
  hospitalCalc(){const v=$('#hospVerdict');if(v)v.innerHTML=hospitalVerdictHtml()},
  saveHospital(){
    const d=$('#hospDate');if(!d||!d.value){toast('Укажите дату выписки',true);return}
    const days=Math.ceil((new Date(d.value+'T12:00:00')-new Date())/86400000);
    S.hospital={date:d.value,days};save();closeModal();render();toast(days>15?'Более 15 дней — отказ':'Дата выписки сохранена',days>15);
  },

  holdModal(){holdModal()},
  holdToggle(){
    HOLD_RUN=!HOLD_RUN;
    const b=$('#holdBtn');if(b)b.innerHTML=HOLD_RUN?ic('pause')+' Пауза':ic('play')+' Продолжить';
  },

  obj(id){if(id!=='nalichnye')RETAIN_PROGRESS[id]=0;objModal(id)},
  retainNext(id){RETAIN_PROGRESS[id]=Math.min(2,(RETAIN_PROGRESS[id]||0)+1);objModal(id)},
  objAction(id,i){
    const o=OBJECTIONS.find(x=>x.id===id);if(!o)return;
    const a=o.actions[i];if(!a)return;
    if(a.a==='resume'){closeModal();render();return}
    if(a.a==='goto'){
      if(o.id==='pozzhe'||o.id==='ne_isklyuchayu'||o.id==='kak_variant_30')S.term='yes';
      if(o.id==='nalichnye')S.pay='chk';
      if(o.id==='kak_vigodnee')S.pay=i===0?'credit':'chk';
      else if(['rassrochka','lizing','dorogo'].includes(o.id))S.pay='chk';
      if(o.id==='dohod'||o.id==='uzhe_kredity')S.pay='credit';
      closeModal();A.go(a.v);return;
    }
    if(a.a==='refuse'){A.doRefuse(o.t);return}
    if(a.a==='callback'){closeModal();callbackModal();return}
    if(a.a==='third'){closeModal();A.thirdModal();return}
    if(a.a==='manager'){if(o.id==='messenger'||o.id==='ya_sam')S.manager='yes';closeModal();A.go('manager');return}
    if(a.a==='kyc'){closeModal();A.go('kyc');return}
    if(a.a==='debts'){closeModal();debtsModal();return}
    if(a.a==='hospital'){closeModal();hospitalModal();return}
    if(a.a==='trade'){closeModal();A.tradeModal();return}
    if(a.a==='open'){closeModal();A.obj(a.v);return}
    closeModal();render();
  },

  cityModal(t){cityModal(t)},
  citySearch(v){
    citySearch=v;
    const l=$('#cityList');if(l)l.innerHTML=cityListHtml(v);
  },
  cityPick(name,status){
    if(CITY_TARGET==='propiska'){
      S.propiska=name;S.propiskaStatus=status==='stop'?'stop':'ok';
    }else{
      S.city=name;S.cityStatus=status;S.visit='';
    }
    save();closeModal();render();toast(CITY_TARGET==='propiska'?'Прописка сохранена':'Город сохранён');
  },
  cityInfo(name){cityInfo(name)},
  cityApply(name,status,target){
    if(target==='propiska'){S.propiska=name;S.propiskaStatus=status==='stop'?'stop':'ok'}
    else{S.city=name;S.cityStatus=status;S.visit=''}
    save();closeModal();VIEW='call';render();toast(target==='propiska'?'Прописка сохранена':'Город сохранён');
  },

  searchObj(v){objSearch=v;const g=$('#objGrid');if(g)g.innerHTML=objCards()},
  objCat(c){objCat=c;render()},
  searchRules(v){ruleSearch=v;const g=$('#ruleGrid');if(g)g.innerHTML=ruleCards()},
  ruleLevel(l){ruleLvl=l;render()},
  ruleCat(c){ruleCat=c;render()},
  searchCity(v){citySearch=v;const g=$('#cityGroups');if(g)g.innerHTML=cityGroups()},
  ref(id){REF_OPEN=id;render();setTimeout(()=>{const e=$('#ref-'+id);if(e){e.open=true;e.scrollIntoView({behavior:'smooth',block:'start'})}},60)},

  copy(text){copyText(text)},
  copySay(el){const t=el.parentElement.querySelector('.txt');if(t)copyText(t.textContent)},
  copyComment(){copyText(buildComment())},
  copyHist(id){const c=CALLS.find(x=>x.id===id);if(c)copyText(c.comment||'')},
  delHist(id){CALLS=CALLS.filter(x=>x.id!==id);storeCalls();render();toast('Удалено')},
  clearHist(){CALLS=[];storeCalls();render();toast('История очищена')},

  newCall(){if(S.startedAt)newCallModal();else A.resetCall()},
  resetCall(){closeModal();if(S.startedAt&&!S.completedAt)saveCall(true);S=newState();THIRD_DRAFT=null;VIEW='call';save();render();toast('Новый звонок')}
};

/* ---------- копирование ---------- */
function copyText(txt){
  const done=()=>toast('Скопировано');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done))}
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done()}catch(e){toast('Не удалось скопировать',true)}
  document.body.removeChild(ta);
}

/* ---------- клавиатура ---------- */
document.addEventListener('keydown',e=>{
  const t=e.target;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='r'){e.preventDefault();A.nav('rules');return}
  if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
  if(e.key==='Escape'){A.close();return}
  if(e.key==='Backspace'){e.preventDefault();A.back();return}
  if(/^[1-9]$/.test(e.key)){const b=$('.ans[data-key="'+e.key+'"]');if(b){e.preventDefault();b.click()}return}
  if(k==='n'){A.newCall()}
  else if(k==='o'){A.nav('objections')}
  else if(k==='r'){A.nav('rules')}
  else if(k==='c'){A.side(true)}
});

document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.mnav');if(b)side(false)},true);

/* ---------- запуск ---------- */
(function init(){
  applyTheme();
  try{OP=localStorage.getItem(LS_OP)||''}catch(e){}
  loadCalls();
  const restored=loadState();
  const h=(location.hash||'').replace('#','');
  if(NAV.some(n=>n.v===h))VIEW=h;
  window.A=A;
  closeModal();
  side(false);
  render();
  loadFleet();
  if(restored)setTimeout(()=>toast('Восстановлен незавершённый звонок'),500);
})();

</script>
